# RoomTrail Spring Boot Base / Development Configuration
# Default profile is 'dev' unless overridden via SPRING_PROFILES_ACTIVE
spring.profiles.default=dev
server.port=${PORT:8080}
spring.application.name=roomtrail-backend

# MySQL Database Configuration (Local Development Fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:roomtrail}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration (Local Development Default Key)
roomtrail.jwt.secret=${JWT_SECRET:RoomTrailDevLocalSigningSecretKeyForDevelopmentOnlyDoNotUseInProduction256Bit}
roomtrail.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Local Development Origins)
roomtrail.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Spring Boot Actuator Health Check for Render Deployment
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
