# RoomTrail Spring Boot Production Configuration
# Activated when SPRING_PROFILES_ACTIVE=prod or -Dspring.profiles.active=prod
server.port=${PORT:8080}
spring.application.name=roomtrail-backend

# Production Database via Environment Variables (NO INSECURE FALLBACKS)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Production Security (NO STATIC FALLBACKS - REQUIRED ENVIRONMENT VARIABLES)
roomtrail.jwt.secret=${JWT_SECRET}
roomtrail.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production CORS (MUST BE EXPLICITLY SET TO DEPLOYED FRONTEND DOMAIN)
roomtrail.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
