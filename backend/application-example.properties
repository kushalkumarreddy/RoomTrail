# RoomTrail Spring Boot 3 Backend Environment & Properties Reference
# Server
server.port=8080
spring.application.name=roomtrail-backend

# MySQL Connection (Override with environment variables in production: SPRING_DATASOURCE_URL, etc.)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:roomtrail}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT Token Signing
roomtrail.jwt.secret=${JWT_SECRET:RoomTrailSecureJwtSecretKeyForTokenSigning2026FullStackJavaSpringMustBeAtLeast256BitsLong}
roomtrail.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Comma-separated origins allowed to make API calls)
roomtrail.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
