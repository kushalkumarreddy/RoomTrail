# RoomTrail Spring Boot Backend Configuration
server.port=8080
spring.application.name=roomtrail-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/roomtrail?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration (HMAC-SHA256, >= 256 bits)
roomtrail.jwt.secret=RoomTrailSecureJwtSecretKeyForTokenSigning2026FullStackJavaSpringMustBeAtLeast256BitsLong
roomtrail.jwt.expiration-ms=86400000

# CORS Allowed Origins
roomtrail.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
